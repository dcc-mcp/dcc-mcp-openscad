[build-system]
requires=["hatchling>=1.17"]
build-backend="hatchling.build"

[project]
name="dcc-mcp-openscad"
version="0.1.1"
description="Production OpenSCAD adapter for deterministic DCC-MCP model validation, export, and rendering"
readme="README.md"
requires-python=">=3.7"
license={text="MIT"}
authors=[{name="loonghao",email="hal.long@outlook.com"}]
keywords=["openscad","cad","parametric-modeling","dcc","mcp","automation"]
classifiers=[
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies=["dcc-mcp-core>=0.19.91,<1.0.0"]

[project.urls]
Homepage="https://github.com/dcc-mcp/dcc-mcp-openscad"
Repository="https://github.com/dcc-mcp/dcc-mcp-openscad"
Issues="https://github.com/dcc-mcp/dcc-mcp-openscad/issues"

[project.optional-dependencies]
test=[
  "pytest>=7.4,<8; python_version<'3.8'",
  "pytest>=8; python_version>='3.8'",
  "ruff>=0.8",
  "PyYAML>=6",
]
dev=[
  "pytest>=7.4,<8; python_version<'3.8'",
  "pytest>=8; python_version>='3.8'",
  "ruff>=0.8",
  "PyYAML>=6",
  "build>=1.2",
  "twine>=6",
]

[project.scripts]
dcc-mcp-openscad="dcc_mcp_openscad.server:main"

[project.entry-points."dcc_mcp.adapters"]
openscad="dcc_mcp_openscad:OpenscadMcpServer"

[tool.hatch.build.targets.wheel]
packages=["src/dcc_mcp_openscad"]
artifacts=["src/dcc_mcp_openscad/skills/**"]

[tool.hatch.build.targets.sdist]
exclude=["docs/**/*.png", "docs/**/*.svg", "docs/**/*.webp"]

[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["src","."]
markers=["openscad: requires a real OpenSCAD CLI"]

[tool.ruff.lint]
select=["E","F","I","B"]

[tool.ruff]
line-length=100
target-version="py37"
