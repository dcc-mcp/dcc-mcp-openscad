name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, "release-please--branches--**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, python: "3.7"}
          - {os: windows-2022, python: "3.7"}
          - {os: ubuntu-latest, python: "3.9"}
          - {os: windows-latest, python: "3.9"}
          - {os: macos-latest, python: "3.9"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: windows-latest, python: "3.12"}
          - {os: macos-latest, python: "3.12"}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Doctor JSON smoke
        run: python -m pytest tests/test_doctor.py -q
      - run: python -m pytest -m "not openscad"

  # Real-hardware coverage: the `-m "not openscad"` contract job above never
  # exercises OpenSCAD itself, so a host CLI break stays invisible until
  # release. This job installs two pinned OpenSCAD builds and runs the one test
  # that actually drives the CLI. Both are pinned by SHA256 and installed with
  # `--appimage-extract`; the OpenSCAD snap is avoided because snapd on GitHub
  # runners is unreliable for this use.
  openscad-real:
    name: Real OpenSCAD ${{ matrix.openscad_version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # The declared support floor, and the last official release line.
          # Ubuntu 22.04 ships exactly 2021.01, so the distribution package is
          # both the simplest and the most faithful way to install this tier.
          - os: ubuntu-22.04
            openscad_version: "2021.01"
            openscad_method: apt
            openscad_provenance: apt:openscad@ubuntu-22.04
          # A current snapshot line, so a CLI removal after 2021.01 is caught.
          - os: ubuntu-22.04
            openscad_version: "2026.09.29"
            openscad_method: appimage
            openscad_provenance: OpenSCAD-2026.09.29-x86_64.AppImage
            openscad_asset: OpenSCAD-2026.09.29-x86_64.AppImage
            openscad_sha256: bae042240484a2c972688d8bb714c04b3422a4d731b3c573e104b3a21854d23c
            openscad_url: https://files.openscad.org/snapshots/OpenSCAD-2026.09.29-x86_64.AppImage
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Record resolved dcc-mcp-core
        run: |
          python -c "import importlib.metadata as m; print('dcc-mcp-core==%s' % m.version('dcc-mcp-core'))" | tee core-version.txt
      - name: Install OpenSCAD system libraries
        # AppImages do not bundle every GL library, and PNG rendering needs a
        # display; xvfb plus Mesa provides a software GL context for both.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libegl1 \
            libgl1-mesa-dri \
            libglx-mesa0 \
            libglu1-mesa \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libfuse2
      - name: Cache OpenSCAD AppImage
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ runner.temp }}/openscad-${{ matrix.openscad_version }}/${{ matrix.openscad_asset }}
          key: openscad-appimage-${{ runner.os }}-${{ matrix.openscad_asset }}
      - name: Install OpenSCAD ${{ matrix.openscad_version }}
        env:
          OPENSCAD_VERSION: ${{ matrix.openscad_version }}
          OPENSCAD_METHOD: ${{ matrix.openscad_method }}
          OPENSCAD_ASSET: ${{ matrix.openscad_asset }}
          OPENSCAD_SHA256: ${{ matrix.openscad_sha256 }}
          OPENSCAD_ASSET_URL: ${{ matrix.openscad_url }}
        run: bash .github/scripts/install-openscad.sh
      - name: Real OpenSCAD end-to-end
        # OPENSCAD_TEST_EXECUTABLE and OPENSCAD_REAL_VERSION come from the
        # install step writing to $GITHUB_ENV.
        run: |
          echo "OpenSCAD ${OPENSCAD_REAL_VERSION} via ${OPENSCAD_TEST_EXECUTABLE}"
          xvfb-run -a python -m pytest -m openscad -v --junitxml=openscad-real-${{ matrix.openscad_version }}.xml
      - name: Assert the real test executed
        if: always()
        run: python3 .github/scripts/verify-openscad-run.py openscad-real-${{ matrix.openscad_version }}.xml
      - name: Upload real run report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: openscad-real-${{ matrix.openscad_version }}
          path: |
            openscad-real-${{ matrix.openscad_version }}.xml
            core-version.txt
          retention-days: 7

  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m build
      - run: python -m twine check dist/*
